<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ghost Net Fishing</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">
        <span class="nav-icon">&#127397;</span>
        <span>Ghost Net Fishing</span>
    </div>
    <div class="nav-links">
        <a th:href="@{/geisternetze}" class="nav-link">Alle Netze</a>
        <a th:href="@{/geisternetze/zu-bergen}" class="nav-link">Zu Bergen</a>
        <a th:href="@{/geisternetze/uebersicht}" class="nav-link">Bergungsübersicht</a>
        <a th:href="@{/meldung/erfassen}" class="nav-link btn-primary">+ Netz melden</a>
    </div>
</nav>

<main class="container">
    <div th:if="${erfolg}" class="alert alert-success" th:text="${erfolg}"></div>
    <div th:if="${fehler}" class="alert alert-danger" th:text="${fehler}"></div>
    <th:block th:fragment="content"></th:block>
</main>

<footer class="footer">
    <p>Ghost Net Fishing &mdash; IU Fallstudie IPWA02-01</p>
</footer>

</body>
</html>
