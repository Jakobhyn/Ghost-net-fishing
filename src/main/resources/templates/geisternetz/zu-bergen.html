<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Zu Bergen – Ghost Net Fishing</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <div class="nav-brand">
        <span class="nav-icon">&#127397;</span>
        <span>Ghost Net Fishing</span>
    </div>
    <div class="nav-links">
        <a th:href="@{/geisternetze}" class="nav-link">Alle Netze</a>
        <a th:href="@{/geisternetze/zu-bergen}" class="nav-link active">Zu Bergen</a>
        <a th:href="@{/geisternetze/uebersicht}" class="nav-link">Bergungsübersicht</a>
        <a th:href="@{/meldung/erfassen}" class="nav-link btn-primary">+ Netz melden</a>
    </div>
</nav>
<main class="container">
    <div th:if="${erfolg}" class="alert alert-success" th:text="${erfolg}"></div>
    <div th:if="${fehler}" class="alert alert-danger" th:text="${fehler}"></div>

    <div class="page-header">
        <h1>Netze die noch geborgen werden müssen</h1>
        <span class="badge" th:text="${netze.size()} + ' offen'"></span>
    </div>

    <div th:if="${netze.empty}" class="empty-state">
        <p>Alle Netze wurden bereits geborgen oder sind in Bearbeitung.</p>
    </div>

    <div class="card-grid" th:if="${!netze.empty}">
        <div class="card" th:each="netz : ${netze}">
            <div class="card-header">
                <span class="card-title">Netz #<span th:text="${netz.id}"></span></span>
                <span class="status-badge GEMELDET">Gemeldet</span>
            </div>
            <div class="card-body">
                <p><strong>Koordinaten:</strong> <span th:text="${netz.latitude} + ', ' + ${netz.longitude}"></span></p>
                <p><strong>Geschätzte Größe:</strong> <span th:text="${netz.groesse}"></span></p>
            </div>
            <div class="card-footer">
                <a th:href="@{/geisternetze/bergung/{id}(id=${netz.id})}" class="btn btn-primary">Bergung eintragen</a>
            </div>
        </div>
    </div>
</main>
<footer class="footer">
    <p>Ghost Net Fishing &mdash; IU Fallstudie IPWA02-01</p>
</footer>
</body>
</html>
