<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Alle Geisternetze – Ghost Net Fishing</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">
        <span class="nav-icon">&#127397;</span>
        <span>Ghost Net Fishing</span>
    </div>
    <div class="nav-links">
        <a th:href="@{/geisternetze}" class="nav-link active">Alle Netze</a>
        <a th:href="@{/geisternetze/zu-bergen}" class="nav-link">Zu Bergen</a>
        <a th:href="@{/geisternetze/uebersicht}" class="nav-link">Bergungsübersicht</a>
        <a th:href="@{/meldung/erfassen}" class="nav-link btn-primary">+ Netz melden</a>
    </div>
</nav>

<main class="container">
    <div th:if="${erfolg}" class="alert alert-success" th:text="${erfolg}"></div>
    <div th:if="${fehler}" class="alert alert-danger" th:text="${fehler}"></div>

    <div class="page-header">
        <h1>Alle gemeldeten Geisternetze</h1>
        <span class="badge" th:text="${netze.size()} + ' Netze'"></span>
    </div>

    <div th:if="${netze.empty}" class="empty-state">
        <p>Noch keine Geisternetze gemeldet.</p>
        <a th:href="@{/meldung/erfassen}" class="btn btn-primary">Erstes Netz melden</a>
    </div>

    <table th:if="${!netze.empty}" class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>GPS-Koordinaten</th>
                <th>Geschätzte Größe</th>
                <th>Status</th>
                <th>Bergende Person</th>
                <th>Aktion</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="netz : ${netze}">
                <td th:text="${netz.id}"></td>
                <td th:text="${netz.latitude} + ', ' + ${netz.longitude}"></td>
                <td th:text="${netz.groesse}"></td>
                <td>
                    <span class="status-badge"
                          th:classappend="${netz.status.name()}"
                          th:text="${netz.status.anzeigeName}">
                    </span>
                </td>
                <td th:text="${netz.bergendePerson != null ? netz.bergendePerson.name : '—'}"></td>
                <td>
                    <form th:if="${netz.status.name() == 'BERGUNG_BEVORSTEHEND'}"
                          th:action="@{/geisternetze/geborgen/{id}(id=${netz.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-success">Als geborgen markieren</button>
                    </form>
                    <a th:if="${netz.status.name() == 'GEMELDET'}"
                       th:href="@{/geisternetze/bergung/{id}(id=${netz.id})}"
                       class="btn btn-sm btn-secondary">Bergung eintragen</a>
                </td>
            </tr>
        </tbody>
    </table>
</main>

<footer class="footer">
    <p>Ghost Net Fishing &mdash; IU Fallstudie IPWA02-01</p>
</footer>
</body>
</html>
